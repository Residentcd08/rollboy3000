<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roll-Boy 3000</title></head><body style="margin:0;background:#061006;color:#39ff6a;font-family:monospace"><div style="padding:20px">Loading Roll-Boy 3000...</div><script>(async()=>{const fs=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt'];const b=(await Promise.all(fs.map(f=>fetch(f).then(r=>r.text())))).join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close();})().catch(e=>document.body.innerHTML='<pre style="color:#ff6b6b;padding:20px">Failed to load Roll-Boy 3000: '+e+'</pre>');</script></body></html>
